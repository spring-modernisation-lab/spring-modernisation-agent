routes:
  - id: spring-boot-application-2.7-to-3

    source:
      repositoryKinds:
        - SpringBootApplication

      springBootMinimum: "2.7.0"
      springBootMaximum: "2.7.x"

    target:
      springBoot: "3.5.x"
      java: "21"

    openRewrite:
      recipes:
        - recipe: "org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5"
          artifact: "org.openrewrite.recipe:rewrite-spring"
          version: "6.43.0"

        - recipe: "org.openrewrite.java.migrate.UpgradeToJava21"
          artifact: "org.openrewrite.recipe:rewrite-migrate-java"
          version: "3.47.0"

    requirements:
      buildSystems:
        - maven

      baselineBuildMustPass: true

    validation:
      - compile
      - unit-tests
      - application-context-test

  - id: spring-library-2.7-to-3

    source:
      repositoryKinds:
        - JavaLibrary

      springBootMinimum: "2.7.0"
      springBootMaximum: "2.7.x"

    target:
      springBoot: "3.5.x"
      java: "21"

    openRewrite:
      recipes:
        - recipe: "org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5"
          artifact: "org.openrewrite.recipe:rewrite-spring"
          version: "6.43.0"

        - recipe: "org.openrewrite.java.migrate.UpgradeToJava21"
          artifact: "org.openrewrite.recipe:rewrite-migrate-java"
          version: "3.47.0"

    requirements:
      buildSystems:
        - maven

      baselineBuildMustPass: true

    validation:
      - compile
      - unit-tests

  - id: spring-parent-2.7-to-3

    source:
      repositoryKinds:
        - ParentPom

      springBootMinimum: "2.7.0"
      springBootMaximum: "2.7.x"

    target:
      springBoot: "3.5.x"
      java: "21"

    openRewrite:
      recipes:
        - recipe: "org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5"
          artifact: "org.openrewrite.recipe:rewrite-spring"
          version: "6.43.0"

        - recipe: "org.openrewrite.java.migrate.UpgradeToJava21"
          artifact: "org.openrewrite.recipe:rewrite-migrate-java"
          version: "3.47.0"

    requirements:
      buildSystems:
        - maven

      baselineBuildMustPass: true

    validation:
      - effective-pom
      - dependency-resolution