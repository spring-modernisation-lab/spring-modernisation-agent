name: Spring modernisation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spring-modernisation
  cancel-in-progress: false

env:
  GITHUB_ORGANISATION: spring-modernisation-lab
  OPENREWRITE_MAVEN_PLUGIN_VERSION: "6.25.0"

jobs:
  assess:
    name: Assess estate and generate strategy
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout migration application
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-build
          --configuration Release

      - name: Run portfolio assessment
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}

          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}

          # This is CI, so don't use the local Development identity mode.
          #
          # For the prototype we need to choose the CI authentication
          # mechanism separately before enabling the real Foundry call.
          FOUNDRY_AUTH_MODE: ${{ vars.FOUNDRY_AUTH_MODE }}
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          assess

      - name: Verify assessment outputs
        shell: bash
        run: |
          test -f Artifacts/project-assessment.json
          test -f Artifacts/transformation-plans.json
          test -f Artifacts/migration-analysis.json
          test -f Artifacts/spring-modernisation-migration-strategy.docx

      - name: Upload assessment outputs
        uses: actions/upload-artifact@v5
        with:
          name: spring-modernisation-assessment
          path: |
            Artifacts/project-assessment.json
            Artifacts/transformation-plans.json
            Artifacts/migration-analysis.json
            Artifacts/spring-modernisation-migration-strategy.docx
          if-no-files-found: error

  transform:
    name: Execute next eligible migration wave
    needs:
      - assess

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      MIGRATION_WORKSPACE_ROOT: ${{ runner.temp }}/spring-modernisation-workspaces

    steps:
      - name: Checkout migration application
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show execution environment
        shell: bash
        run: |
          dotnet --version
          java --version
          mvn --version
          git --version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-build
          --configuration Release

      - name: Download assessment outputs
        uses: actions/download-artifact@v6
        with:
          name: spring-modernisation-assessment
          path: Artifacts

      - name: Verify approved transformation plans
        shell: bash
        run: |
          test -f Artifacts/transformation-plans.json

      - name: Execute next eligible migration wave
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          transform

      - name: Upload transformation results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: transformation-results-${{ github.run_number }}
          path: Artifacts/transformation-results.json
          if-no-files-found: warn