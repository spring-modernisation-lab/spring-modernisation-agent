name: Spring modernisation

on:
  workflow_dispatch:
    inputs:
      remediation:
        description: >-
          Run scoped AI ports for known API moves (Azure AI Foundry; one
          attempt and one repair per task; Maven and the behaviour contract
          decide what is kept)
        type: boolean
        default: false
      open-draft-pull-requests:
        description: >-
          Open or update draft pull requests on migration branches for
          repositories that passed or need a decision (never merged)
        type: boolean
        default: false
      recipe-discovery:
        description: >-
          Look for OpenRewrite recipes that could fix what the route's recipes
          left, and measure them on a throwaway copy (no AI; suggestions only)
        type: boolean
        default: true
      behaviour-contract:
        description: >-
          Record what each application does on Boot 2.7 and check the migrated
          one does the same (success needs both Maven and the contract)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: spring-modernisation
  cancel-in-progress: false

env:
  GITHUB_ORGANISATION: spring-modernisation-lab
  OPENREWRITE_MAVEN_PLUGIN_VERSION: "6.46.1"

jobs:
  baseline:
    name: Baseline build evidence
    uses: ./.github/workflows/portfolio-baseline-build.yml
    with:
      # A failed baseline is evidence for readiness (the repository becomes
      # Blocked), not a reason to stop assessing the rest of the estate.
      fail-on-baseline-failure: false

  assess:
    name: Assess estate and generate strategy
    needs:
      - baseline
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read
      # Lets the job request a short-lived GitHub OIDC token, which Azure
      # exchanges for access to Foundry. No Azure secret is stored.
      id-token: write

    steps:
      - name: Checkout migration application
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-build
          --configuration Release

      - name: Download baseline build evidence
        uses: actions/download-artifact@v6
        with:
          name: baseline-build-results
          path: Artifacts

      # The Strategy Agent is optional. If AZURE_CLIENT_ID is not set, or the
      # Azure login fails, FOUNDRY_PROJECT_ENDPOINT is left empty and assess
      # skips the AI stage. If the agent itself fails, assess still succeeds.
      # Deterministic migration never depends on the AI stage.
      - name: Sign in to Azure (GitHub OIDC)
        id: azure_login
        if: vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run portfolio assessment
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}

          FOUNDRY_PROJECT_ENDPOINT: ${{ steps.azure_login.outcome == 'success' && vars.FOUNDRY_PROJECT_ENDPOINT || '' }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          FOUNDRY_AUTH_MODE: AzureCli
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          assess

      - name: Verify deterministic assessment outputs
        shell: bash
        run: |
          test -f Artifacts/baseline-build-results.json
          test -f Artifacts/project-assessment.json
          test -f Artifacts/transformation-plans.json

      - name: Report AI strategy outputs
        shell: bash
        run: |
          if [ -f Artifacts/spring-modernisation-migration-strategy.docx ]; then
            echo "AI migration strategy document produced."
          else
            echo "::warning title=No AI strategy document::The Strategy Agent was skipped or failed; see the 'Run portfolio assessment' log. Deterministic migration is unaffected."
          fi

      - name: Upload assessment outputs
        uses: actions/upload-artifact@v5
        with:
          name: spring-modernisation-assessment
          # The AI strategy files are optional; missing ones are skipped.
          path: |
            Artifacts/baseline-build-results.json
            Artifacts/project-assessment.json
            Artifacts/transformation-plans.json
            Artifacts/migration-analysis.json
            Artifacts/spring-modernisation-migration-strategy.docx
          if-no-files-found: error

  transform:
    name: Execute next eligible migration wave
    needs:
      - assess

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read
      # For the optional AI results report (GitHub OIDC to Azure).
      id-token: write

    steps:
      - name: Checkout migration application
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The behaviour contract records the Boot 2.7 baseline with the JDK it
      # was built for; Java 21, set up next, stays the default.
      - name: Set up Java 11 (behaviour baseline)
        id: java11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # No `cache: maven`: this repository has no pom.xml to key a cache
          # on. The Maven projects are cloned at runtime by the transform.

      - name: Show execution environment
        shell: bash
        run: |
          dotnet --version
          java --version
          mvn --version
          git --version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-build
          --configuration Release

      - name: Download assessment outputs
        uses: actions/download-artifact@v6
        with:
          name: spring-modernisation-assessment
          path: Artifacts

      - name: Verify approved transformation plans
        shell: bash
        run: |
          test -f Artifacts/transformation-plans.json

      # Used by the optional Remediation Agent and the AI results report. A
      # failed sign-in disables both; deterministic migration still runs.
      - name: Sign in to Azure (GitHub OIDC)
        id: azure_login
        if: vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Execute next eligible migration wave
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
          # The runner context is only available at step level.
          MIGRATION_WORKSPACE_ROOT: ${{ runner.temp }}/spring-modernisation-workspaces
          # Remediation changes code, so it is off unless explicitly chosen.
          MIGRATION_REMEDIATION: ${{ (inputs.remediation && steps.azure_login.outcome == 'success') && 'enabled' || 'disabled' }}
          MIGRATION_RECIPE_DISCOVERY: ${{ inputs.recipe-discovery && 'enabled' || 'disabled' }}
          MIGRATION_BEHAVIOUR_CONTRACT: ${{ inputs.behaviour-contract && 'enabled' || 'disabled' }}
          MIGRATION_BASELINE_JAVA_HOME: ${{ steps.java11.outputs.path }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          FOUNDRY_AUTH_MODE: AzureCli
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          transform

      # The AI results report is optional and read-only. It runs even when
      # validation failed (that is when it is most useful), and its failure
      # never changes the migration outcome.
      - name: Generate AI migration results report
        if: always() && steps.azure_login.outcome == 'success'
        continue-on-error: true
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
          FOUNDRY_AUTH_MODE: AzureCli
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          report

      # Reviewer summaries are always written. Draft pull requests are only
      # opened when chosen, on migration/ branches, and never merged.
      - name: Reviewer summaries and draft pull requests
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
          MIGRATION_WORKSPACE_ROOT: ${{ runner.temp }}/spring-modernisation-publish
          MIGRATION_PUBLISH_PULL_REQUESTS: ${{ inputs.open-draft-pull-requests && 'enabled' || 'disabled' }}
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          publish

      - name: Upload transformation results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: transformation-results-${{ github.run_number }}
          # The AI report files are optional; missing ones are skipped.
          # Patches preserve the migrated code after workspace cleanup.
          path: |
            Artifacts/transformation-results.json
            Artifacts/transformation-summary.md
            Artifacts/migration-results-analysis.json
            Artifacts/spring-modernisation-migration-results.docx
            Artifacts/patches/**
            Artifacts/summaries/**
            Artifacts/pull-requests.json
          if-no-files-found: warn