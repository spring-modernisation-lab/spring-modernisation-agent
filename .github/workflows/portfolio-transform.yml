name: Spring modernisation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spring-modernisation
  cancel-in-progress: false

env:
  GITHUB_ORGANISATION: spring-modernisation-lab
  OPENREWRITE_MAVEN_PLUGIN_VERSION: "6.46.1"

jobs:
  baseline:
    name: Baseline build evidence
    uses: ./.github/workflows/portfolio-baseline-build.yml
    with:
      # A failed baseline is evidence for readiness (the repository becomes
      # Blocked), not a reason to stop assessing the rest of the estate.
      fail-on-baseline-failure: false

  assess:
    name: Assess estate and generate strategy
    needs:
      - baseline
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout migration application
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-build
          --configuration Release

      - name: Download baseline build evidence
        uses: actions/download-artifact@v6
        with:
          name: baseline-build-results
          path: Artifacts

      - name: Run portfolio assessment
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}

          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}

          # Optional: when FOUNDRY_PROJECT_ENDPOINT is not configured the
          # Strategy Agent is skipped, and if it fails assess still succeeds.
          # Deterministic migration never depends on the AI stage.
          FOUNDRY_AUTH_MODE: ${{ vars.FOUNDRY_AUTH_MODE }}
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          assess

      - name: Verify deterministic assessment outputs
        shell: bash
        run: |
          test -f Artifacts/baseline-build-results.json
          test -f Artifacts/project-assessment.json
          test -f Artifacts/transformation-plans.json

      - name: Upload assessment outputs
        uses: actions/upload-artifact@v5
        with:
          name: spring-modernisation-assessment
          # The AI strategy files are optional; missing ones are skipped.
          path: |
            Artifacts/baseline-build-results.json
            Artifacts/project-assessment.json
            Artifacts/transformation-plans.json
            Artifacts/migration-analysis.json
            Artifacts/spring-modernisation-migration-strategy.docx
          if-no-files-found: error

  transform:
    name: Execute next eligible migration wave
    needs:
      - assess

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout migration application
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show execution environment
        shell: bash
        run: |
          dotnet --version
          java --version
          mvn --version
          git --version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release

      - name: Run tests
        run: >
          dotnet test
          --no-build
          --configuration Release

      - name: Download assessment outputs
        uses: actions/download-artifact@v6
        with:
          name: spring-modernisation-assessment
          path: Artifacts

      - name: Verify approved transformation plans
        shell: bash
        run: |
          test -f Artifacts/transformation-plans.json

      - name: Execute next eligible migration wave
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
          # The runner context is only available at step level.
          MIGRATION_WORKSPACE_ROOT: ${{ runner.temp }}/spring-modernisation-workspaces
        run: >
          dotnet run
          --project ./src/SpringModernisationAgent
          --configuration Release
          --no-build
          --
          transform

      - name: Upload transformation results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: transformation-results-${{ github.run_number }}
          path: Artifacts/transformation-results.json
          if-no-files-found: warn