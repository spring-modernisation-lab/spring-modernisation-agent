name: Portfolio Baseline Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-build:
    name: Baseline build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # -------------------------
      # Wave 1
      # -------------------------

      - name: Checkout platform-parent
        uses: actions/checkout@v6
        with:
          repository: spring-modernisation-lab/platform-parent
          path: repositories/platform-parent

      - name: Capture platform-parent commit
        id: platform_parent_commit
        working-directory: repositories/platform-parent
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  
      - name: Build platform-parent
        id: platform_parent
        continue-on-error: true
        working-directory: repositories/platform-parent
        run: mvn --batch-mode clean install

      # -------------------------
      # Wave 2
      # -------------------------

      - name: Checkout shared-security
        uses: actions/checkout@v6
        with:
          repository: spring-modernisation-lab/shared-security
          path: repositories/shared-security
      
      - name: Capture shared-security commit
        id: shared_security_commit
        working-directory: repositories/shared-security
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  
      - name: Build shared-security
        id: shared_security
        continue-on-error: true
        working-directory: repositories/shared-security
        run: mvn --batch-mode clean install

      # -------------------------
      # Wave 3
      # -------------------------

      - name: Checkout account-service
        uses: actions/checkout@v6
        with:
          repository: spring-modernisation-lab/account-service
          path: repositories/account-service

      - name: Build account-service
        id: account_service
        continue-on-error: true
        working-directory: repositories/account-service
        run: mvn --batch-mode clean verify
        
      - name: Capture account-service commit
        id: account_service_commit
        working-directory: repositories/account-service
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        
      - name: Checkout customer-service
        uses: actions/checkout@v6
        with:
          repository: spring-modernisation-lab/customer-service
          path: repositories/customer-service

      - name: Capture customer-service commit
        id: customer_service_commit
        working-directory: repositories/customer-service
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  
      - name: Build customer-service
        id: customer_service
        continue-on-error: true
        working-directory: repositories/customer-service
        run: mvn --batch-mode clean verify

      # -------------------------
      # Structured results
      # -------------------------

      - name: Create baseline build results
        if: always()
        env:
          PLATFORM_PARENT: ${{ steps.platform_parent.outcome }}
          PLATFORM_PARENT_SHA: ${{ steps.platform_parent_commit.outputs.sha }}
        
          SHARED_SECURITY: ${{ steps.shared_security.outcome }}
          SHARED_SECURITY_SHA: ${{ steps.shared_security_commit.outputs.sha }}
        
          ACCOUNT_SERVICE: ${{ steps.account_service.outcome }}
          ACCOUNT_SERVICE_SHA: ${{ steps.account_service_commit.outputs.sha }}
        
          CUSTOMER_SERVICE: ${{ steps.customer_service.outcome }}
          CUSTOMER_SERVICE_SHA: ${{ steps.customer_service_commit.outputs.sha }}
        run: |
          mkdir -p artifacts

          python3 <<'PY'
          import json
          import os

          def status(value):
              return "Passed" if value == "success" else "Failed"

          result = {
              "Repositories": [
                  {
                      "RepositoryName": "platform-parent",
                      "CommitSha": os.environ["PLATFORM_PARENT_SHA"],
                      "Wave": 1,
                      "Operation": "Install",
                      "Status": status(os.environ["PLATFORM_PARENT"])
                  },
                  {
                      "RepositoryName": "shared-security",
                      "CommitSha": os.environ["SHARED_SECURITY_SHA"],
                      "Wave": 2,
                      "Operation": "Install",
                      "Status": status(os.environ["SHARED_SECURITY"])
                  },
                  {
                      "RepositoryName": "account-service",
                      "CommitSha": os.environ["ACCOUNT_SERVICE_SHA"],
                      "Wave": 3,
                      "Operation": "Verify",
                      "Status": status(os.environ["ACCOUNT_SERVICE"])
                  },
                  {
                      "RepositoryName": "customer-service",
                      "CommitSha": os.environ["CUSTOMER_SERVICE_SHA"],
                      "Wave": 3,
                      "Operation": "Verify",
                      "Status": status(os.environ["CUSTOMER_SERVICE"])
                  }
              ]
          }

          with open(
              "artifacts/baseline-build-results.json",
              "w",
              encoding="utf-8"
          ) as output:
              json.dump(result, output, indent=2)

          print(json.dumps(result, indent=2))
          PY

      - name: Upload baseline build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-build-results
          path: artifacts/baseline-build-results.json
          if-no-files-found: error

      # -------------------------
      # Fail the overall workflow
      # after collecting evidence
      # -------------------------

      - name: Fail workflow if a baseline build failed
        if: always()
        env:
          PLATFORM_PARENT: ${{ steps.platform_parent.outcome }}
          SHARED_SECURITY: ${{ steps.shared_security.outcome }}
          ACCOUNT_SERVICE: ${{ steps.account_service.outcome }}
          CUSTOMER_SERVICE: ${{ steps.customer_service.outcome }}
        run: |
          if [ "$PLATFORM_PARENT" != "success" ] ||
             [ "$SHARED_SECURITY" != "success" ] ||
             [ "$ACCOUNT_SERVICE" != "success" ] ||
             [ "$CUSTOMER_SERVICE" != "success" ]; then
            echo "One or more baseline builds failed."
            exit 1
          fi
