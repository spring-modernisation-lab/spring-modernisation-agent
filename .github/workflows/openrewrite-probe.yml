name: OpenRewrite probe

# Discovery tool for the demo: runs the pinned OpenRewrite recipes for one
# approved route against one repository, then builds the result. The aim is
# to find out which upgrade problems the deterministic recipes leave behind.
# It never pushes or changes the target repository.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository in the organisation to probe
        required: true
        default: orders-service
      route:
        description: Migration route id from Config/spring.yaml
        required: true
        default: spring-boot-application-2.7-to-3
      candidate-recipes:
        description: >-
          Optional recipe-discovery candidates to measure, run after the route's
          recipes; comma-separated recipe@group:artifact:version. Measurement
          only, never part of a route.
        required: false
        default: ""

permissions:
  contents: read

env:
  GITHUB_ORGANISATION: spring-modernisation-lab
  OPENREWRITE_MAVEN_PLUGIN_VERSION: "6.46.1"
  POLICY_PATH: agent/src/SpringModernisationAgent/Config/spring.yaml
  OUTPUT_DIR: ${{ github.workspace }}/probe-output

jobs:
  probe:
    name: Probe ${{ inputs.repository }} (${{ inputs.route }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout migration application (policy source)
        uses: actions/checkout@v6
        with:
          path: agent

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITHUB_ORGANISATION }}/${{ inputs.repository }}
          token: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
          path: repo

      - name: Record source commit
        working-directory: repo
        run: |
          mkdir -p "$OUTPUT_DIR"
          git rev-parse HEAD | tee "$OUTPUT_DIR/source-commit.txt"

      - name: Set up Java 11 (baseline)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Baseline build (must pass before migration)
        working-directory: repo
        run: |
          set -o pipefail
          mvn --batch-mode verify 2>&1 | tee "$OUTPUT_DIR/baseline-build.log"
          mvn --batch-mode --quiet clean

      - name: Set up Java 21 (target)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run pinned OpenRewrite recipes for the route
        working-directory: repo
        env:
          ROUTE: ${{ inputs.route }}
        run: |
          set -euo pipefail

          recipes=$(yq -o=json \
            '.routes[] | select(.id == strenv(ROUTE)) | .openRewrite.recipes' \
            "$GITHUB_WORKSPACE/$POLICY_PATH")

          if [ -z "$recipes" ] || [ "$recipes" = "null" ]; then
            echo "Route '$ROUTE' was not found in $POLICY_PATH"
            exit 1
          fi

          echo "$recipes" | tee "$OUTPUT_DIR/recipes.json"

          mapfile -t entries < <(echo "$recipes" | jq -c '.[]')

          for entry in "${entries[@]}"; do
            recipe=$(echo "$entry" | jq -r '.recipe')
            artifact=$(echo "$entry" | jq -r '.artifact // empty')
            version=$(echo "$entry" | jq -r '.version // empty')
            configuration=$(echo "$entry" | jq -r '.configuration // empty')

            # A pipeline recipe names a file under Config/ (outside this
            # repository) instead of a published artifact.
            if [ -n "$configuration" ]; then
              source="-Drewrite.configLocation=$GITHUB_WORKSPACE/$(dirname "$POLICY_PATH")/$configuration"
            else
              source="-Drewrite.recipeArtifactCoordinates=${artifact}:${version}"
            fi

            echo "::group::$recipe (${configuration:-$artifact:$version})"
            mvn --batch-mode \
              "org.openrewrite.maven:rewrite-maven-plugin:${OPENREWRITE_MAVEN_PLUGIN_VERSION}:runNoFork" \
              "-Drewrite.activeRecipes=${recipe}" \
              "$source" \
              2>&1 | tee -a "$OUTPUT_DIR/openrewrite.log"
            echo "::endgroup::"
          done

      # Candidates are measured on the code the route's recipes leave (the
      # code the AI would otherwise see), so the route's changes are first
      # committed in this throwaway clone. Nothing is ever pushed: the job has
      # read-only permission on the target repository.
      - name: Run candidate recipes (recipe discovery)
        if: inputs.candidate-recipes != ''
        working-directory: repo
        env:
          CANDIDATES: ${{ inputs.candidate-recipes }}
        run: |
          set -euo pipefail

          git add -A
          git -c user.name=probe -c user.email=probe@localhost -c commit.gpgsign=false \
            commit --quiet --allow-empty -m "route recipes (probe only, never pushed)"

          IFS=',' read -ra candidates <<< "$CANDIDATES"

          for raw in "${candidates[@]}"; do
            candidate="$(echo "$raw" | xargs)"

            # recipe@group:artifact:version, nothing else reaches the shell.
            if ! [[ "$candidate" =~ ^[A-Za-z0-9_.$]+@[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::Candidate '$candidate' is not recipe@group:artifact:version"
              exit 1
            fi

            recipe="${candidate%@*}"
            coordinates="${candidate#*@}"

            echo "::group::candidate $recipe ($coordinates)"
            # A candidate that fails to run (for example, built for a newer
            # OpenRewrite core) is a result to record, not a probe failure.
            set +e
            mvn --batch-mode \
              "org.openrewrite.maven:rewrite-maven-plugin:${OPENREWRITE_MAVEN_PLUGIN_VERSION}:runNoFork" \
              "-Drewrite.activeRecipes=${recipe}" \
              "-Drewrite.recipeArtifactCoordinates=${coordinates}" \
              2>&1 | tee -a "$OUTPUT_DIR/candidates.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "- \`$recipe\` (\`$coordinates\`): ran" >> "$OUTPUT_DIR/candidates.txt"
            else
              echo "- \`$recipe\` (\`$coordinates\`): **failed to run** (exit $status); see candidates.log" >> "$OUTPUT_DIR/candidates.txt"
            fi
          done

          git add -A
          git diff --cached --stat | tee "$OUTPUT_DIR/candidates-diffstat.txt"
          git diff --cached --binary > "$OUTPUT_DIR/candidates.patch"

      - name: Capture OpenRewrite changes
        working-directory: repo
        run: |
          # Everything since the assessed commit: the route's recipes plus any candidates.
          git add -A
          source_commit="$(cat "$OUTPUT_DIR/source-commit.txt")"
          git diff --cached --stat "$source_commit" | tee "$OUTPUT_DIR/openrewrite-diffstat.txt"
          git diff --cached --binary "$source_commit" > "$OUTPUT_DIR/openrewrite.patch"

      - name: Post-migration build
        id: post_migration
        working-directory: repo
        run: |
          set +e
          set -o pipefail
          mvn --batch-mode verify 2>&1 | tee "$OUTPUT_DIR/post-migration-build.log"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ -d target/surefire-reports ]; then
            cp -r target/surefire-reports "$OUTPUT_DIR/surefire-reports"
          fi

          # A failed build is the expected finding, not a probe failure.
          exit 0

      - name: Summarise findings
        if: always()
        env:
          EXIT_CODE: ${{ steps.post_migration.outputs.exit_code }}
        run: |
          {
            echo "## OpenRewrite probe: ${{ inputs.repository }}"
            echo
            echo "- Route: \`${{ inputs.route }}\`"
            echo "- Source commit: \`$(cat "$OUTPUT_DIR/source-commit.txt" 2>/dev/null)\`"
            echo "- Post-migration build exit code: \`${EXIT_CODE:-not run}\`"
            echo "- Compile errors: \`$(grep -oE '^\[INFO\] [0-9]+ errors?' "$OUTPUT_DIR/post-migration-build.log" 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo 0)\`"
            echo
            if [ -f "$OUTPUT_DIR/candidates.txt" ]; then
              echo "### Candidate recipes measured (not part of the route)"
              echo
              cat "$OUTPUT_DIR/candidates.txt"
              echo
              echo "Files the candidates changed, on top of the route's recipes:"
              echo '```'
              cat "$OUTPUT_DIR/candidates-diffstat.txt" 2>/dev/null || echo "(none)"
              echo '```'
              echo
            fi
            echo "### Files changed by OpenRewrite"
            echo '```'
            cat "$OUTPUT_DIR/openrewrite-diffstat.txt" 2>/dev/null || echo "(none)"
            echo '```'
            echo
            echo "### Post-migration errors (first 80)"
            echo '```'
            grep -E '^\[ERROR\]' "$OUTPUT_DIR/post-migration-build.log" 2>/dev/null | head -80 || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: openrewrite-probe-${{ inputs.repository }}-${{ github.run_number }}
          path: probe-output/
          if-no-files-found: warn
